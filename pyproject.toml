[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awingi-nlp-platform"
version = "0.1.0"
description = "Awingi Low-Resource Language Model & Agricultural Question Answering Platform"
authors = [
    { name = "Injibara University CS Capstone Team", email = "makmaiek38@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "jinja2>=3.1.3,<4.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "psycopg2-binary>=2.9.9",
    "pg8000>=1.31.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
ml = [
    "sentencepiece>=0.2.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
    "faiss-cpu>=1.8.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
