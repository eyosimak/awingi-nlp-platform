{% extends "base.html" %}

{% block title %}Register Reviewer Account — Awingi NLP Platform{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white rounded-2xl p-8 border border-slate-200 shadow-md">
    <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-brand-600 text-white font-bold text-2xl flex items-center justify-center mx-auto mb-3 shadow-xs">
            A
        </div>
        <h1 class="text-xl font-bold text-slate-900">Create Reviewer Account</h1>
        <p class="text-xs text-slate-500 mt-1">Join the Awingi language curation team</p>
    </div>

    {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/auth/register" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
            <input type="text" name="username" required autofocus placeholder="e.g. tesfaye_awi"
                   class="w-full text-xs rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 py-2.5 px-3 bg-slate-50">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="name@injibara.edu.et"
                   class="w-full text-xs rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 py-2.5 px-3 bg-slate-50">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required placeholder="Minimum 6 characters" minlength="6"
                   class="w-full text-xs rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 py-2.5 px-3 bg-slate-50">
        </div>

        <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs shadow-xs transition-colors">
            Create Account & Enter Platform
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-500">
            Already have an account?
            <a href="/auth/login" class="font-semibold text-brand-600 hover:text-brand-800">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
